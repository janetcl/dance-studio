<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Court Mode · Dance Studio</title>
  <meta name="description" content="Draw up basketball plays beat by beat and watch them run on a 3D half court." />
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="court.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js", "three/addons/": "../vendor/" } }
  </script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" href="../" title="Dance Studio"><img src="../assets/icon.svg" alt="" width="26" height="26" /><span class="hide-sm">Dance Studio</span></a>
      <nav class="modes hide-xs" aria-label="Mode"><a href="../">Dance</a><a href="./" aria-current="page">Court</a></nav>
      <div class="seg mode-seg" role="group" aria-label="Edit or watch"><button data-mode="edit">Edit</button><button data-mode="watch">Watch</button></div>
      <input id="title" class="title-input" spellcheck="false" aria-label="Play name" />
      <span id="saved" class="saved">Saved</span>
      <div class="topbar-right">
        <button class="icon-btn only-narrow" data-action="toggle-left" title="Beats"><i data-icon="sliders"></i></button>
        <button class="icon-btn only-narrow edit-only" data-action="toggle-right" title="Players"><i data-icon="users"></i></button>
        <button class="icon-btn edit-only" data-action="undo" title="Undo (⌘Z)"><i data-icon="undo"></i></button>
        <button class="icon-btn edit-only" data-action="redo" title="Redo (⇧⌘Z)"><i data-icon="redo"></i></button>
        <button class="btn ghost hide-xs edit-only" data-action="flip" title="Mirror the play left ↔ right"><i data-icon="mirror"></i><span class="hide-sm">Flip</span></button>
        <button class="btn ghost hide-xs edit-only" data-action="new" title="New play"><i data-icon="plus"></i><span class="hide-sm">New</span></button>
        <button class="btn ghost" data-action="playbook"><i data-icon="folder"></i><span class="hide-sm">Playbook</span></button>
        <button class="btn primary" data-action="share"><i data-icon="share"></i><span class="hide-sm">Share</span></button>
      </div>
    </header>

    <aside class="panel left" id="left">
      <div class="panel-head">
        <h2>Beats <span class="count" id="beat-count">0</span></h2>
        <button class="btn small" data-action="add-beat" title="New beat after this one (B)"><i data-icon="plus"></i>New</button>
      </div>
      <ol class="cards" id="cards"></ol>
      <div class="watch-side">
        <div class="panel-head">
          <h2>Playbook <span class="count" id="pl-count"></span></h2>
          <button class="switch-row" data-action="autoplay" role="switch" id="autoplay" aria-checked="true"><span>Autoplay</span><span class="switch"><span></span></span></button>
        </div>
        <ol class="playlist" id="playlist"></ol>
      </div>
    </aside>

    <main class="stage-wrap" id="stage-wrap">
      <div class="stage" id="stage"></div>
      <div class="labels" id="labels"></div>
      <div class="caption" id="caption" hidden><b id="cap-title"></b><span id="cap-text"></span></div>
      <div class="stage-toolbar">
        <div class="seg" role="group" aria-label="Camera">
          <button data-view="broadcast">Broadcast</button>
          <button data-view="baseline">Baseline</button>
          <button data-view="top">Top</button>
        </div>
        <div class="toggles">
          <button class="chip on" data-toggle="arrows">Arrows</button>
          <button class="chip on" data-toggle="defense">Defense</button>
          <button class="chip on" data-toggle="tags">Numbers</button>
          <div class="pop-wrap">
            <button class="chip" data-action="colors-pop" id="colors-btn">Colors</button>
            <div class="pop" id="colors-pop" hidden></div>
          </div>
          <div class="pop-wrap">
            <button class="chip" data-action="court-pop">Court</button>
            <div class="pop court" id="court-pop" hidden></div>
          </div>
        </div>
      </div>
      <div class="stage-hint" id="hint"></div>
      <div class="upnext" id="upnext" hidden role="status">
        <div class="un-thumb" id="un-thumb"></div>
        <div class="un-t"><span class="un-k">Up next</span><b id="un-name"></b><span id="un-meta"></span><span class="un-bar"><span id="un-fill"></span></span></div>
        <div class="un-acts"><button class="btn small primary" data-action="upnext-now">Play now</button><button class="btn small" data-action="upnext-stay">Stay on this one</button></div>
      </div>
      <button class="btn edit-this" data-action="edit-this"><i data-icon="route"></i>Edit this play</button>
      <div class="legend" aria-hidden="true">
        <span><svg width="24" height="10"><line x1="0" y1="5" x2="22" y2="5" stroke="#E0552E" stroke-width="2.5"/></svg>Cut</span>
        <span><svg width="24" height="10"><polyline points="0,5 4,1 8,9 12,1 16,9 20,1 23,5" fill="none" stroke="#E0552E" stroke-width="1.8"/></svg>Dribble</span>
        <span><svg width="24" height="10"><line x1="0" y1="5" x2="22" y2="5" stroke="#E0552E" stroke-width="2.5" stroke-dasharray="5 4"/></svg>Pass</span>
        <span><svg width="24" height="12"><line x1="0" y1="6" x2="18" y2="6" stroke="#1D1A17" stroke-width="2"/><line x1="19" y1="0" x2="19" y2="12" stroke="#1D1A17" stroke-width="4"/></svg>Screen</span>
      </div>
    </main>

    <aside class="panel right" id="right">
      <section class="roster">
        <div class="panel-head"><h2>Players <span class="count" id="size-label"></span></h2></div>
        <div class="roster-grid" id="roster"></div>
      </section>
      <div id="insp" class="insp"></div>
    </aside>

    <section class="timeline" aria-label="Timeline">
      <div class="tl-head">
        <button class="play" data-action="play" id="play-btn" title="Play / pause (Space)"><i data-icon="play"></i></button>
        <button class="icon-btn" data-action="prev" title="Previous beat ([)"><i data-icon="skip-back"></i></button>
        <button class="icon-btn" data-action="next" title="Next beat (])"><i data-icon="skip-fwd"></i></button>
        <div class="now"><b id="beat-now">Start</b><span class="play-of" id="play-of"></span><span><span id="time-now">0:00.0</span> / <span id="time-total">0:00</span></span></div>
        <div class="shot" title="Shot clock"><small>SHOT CLOCK</small><span id="clock">24.0</span></div>
        <button class="btn small ghost" data-action="speed" id="speed">1×</button>
        <div class="tl-spacer"></div>
        <div class="seg small edit-only" role="group" aria-label="Timeline view">
          <button data-tl="beats">Beats</button>
          <button data-tl="lanes">Lanes</button>
        </div>
      </div>
      <div class="tl-body">
        <div class="ruler" id="ruler" title="Drag to scrub"></div>
        <div class="blocks" id="blocks"></div>
        <div class="lanes" id="lanes" hidden></div>
        <div class="playhead" id="playhead"></div>
      </div>
    </section>
  </div>

  <dialog class="modal wide pb" id="playbook" aria-labelledby="pb-h">
    <div class="pb-head">
      <div><h2 id="pb-h">Playbook</h2></div>
      <div class="pb-head-actions"><button class="btn" data-action="watch-all"><i data-icon="play"></i>Watch them all</button><button class="btn" data-action="new"><i data-icon="plus"></i>Blank play</button><button class="icon-btn" data-close aria-label="Close"><i data-icon="x"></i></button></div>
    </div>
    <div class="pb-main">
      <nav class="pb-nav" id="pb-nav" aria-label="Play types"></nav>
      <section class="pb-content">
        <h3 id="pb-title"></h3>
        <p id="pb-desc" class="pb-desc"></p>
        <div id="pb-body"></div>
      </section>
    </div>
  </dialog>

  <dialog class="modal small" id="newplay">
    <form method="dialog" id="newplay-form">
      <div class="modal-head"><h2>New play</h2><button class="icon-btn" type="button" data-close aria-label="Close"><i data-icon="x"></i></button></div>
      <label class="field"><span>Name</span><input name="name" value="New play" required /></label>
      <div class="field"><span>Players</span>
        <div class="seg sizes" role="radiogroup" aria-label="Players">
          <label><input type="radio" name="size" value="1" />1v1</label>
          <label><input type="radio" name="size" value="2" />2v2</label>
          <label><input type="radio" name="size" value="3" />3v3</label>
          <label><input type="radio" name="size" value="4" />4v4</label>
          <label><input type="radio" name="size" value="5" checked />5v5</label>
        </div>
      </div>
      <label class="field"><span>Defense</span>
        <select name="defense"><option value="man">Man to man (follows automatically)</option><option value="zone">2-3 zone (moves automatically)</option><option value="hand">Placed by hand</option><option value="none">No defense</option></select>
      </label>
      <label class="field"><span>Colors</span><select name="theme" id="np-theme"></select></label>
      <div class="modal-actions">
        <button class="btn ghost" type="button" data-close>Cancel</button>
        <button class="btn primary" value="ok">Create play</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
