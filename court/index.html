<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Court Mode · Dance Studio</title>
  <meta name="description" content="Watch a basketball play happen beat by beat on a 3D half court." />
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js", "three/addons/": "../vendor/" } }
  </script>
  <style>
    :root {
      --bg: #F3F0EA; --surface: #FFFFFF; --surface-3: #EFEBE4; --line: #E3DDD3;
      --ink: #1D1A17; --ink-2: #625B53; --ink-3: #8A8278; --accent: #E0552E; --accent-soft: #FBE7DF;
      --o: #D62839; --o-ink: #fff; --d: #1F4FD1; --d-ink: #fff;
      --font: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
      --serif: "Instrument Serif", Georgia, serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .app { height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); overflow: hidden; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; text-decoration: none; color: inherit; }
    .brand img { width: 24px; height: 24px; }
    .pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: #8F3215; }
    .title { font-family: var(--serif); font-size: 22px; line-height: 1.1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .themes { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
    .themes button { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; }
    .themes button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
    .sw { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.15); }
    .sw + .sw { margin-left: -9px; }
    main { position: relative; min-height: 0; overflow: hidden; }
    #court { position: absolute; inset: 0; }
    #court canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .tag { position: absolute; left: 0; top: 0; font: 700 12px/1 var(--font); padding: 3px 7px; border-radius: 999px; white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
    .tag.O { background: var(--o); color: var(--o-ink); border: 1.5px solid rgba(255,255,255,.9); }
    .tag.D { background: var(--d); color: var(--d-ink); border: 1.5px solid rgba(255,255,255,.9); }
    .caption { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); background: rgba(29,26,23,.88); color: #fff; border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
    .caption b { font-size: 15px; }
    .caption span { color: #E4DDD2; font-size: 13px; }
    .views { position: absolute; left: 14px; bottom: 14px; display: flex; padding: 3px; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
    .views button { border: 0; background: transparent; padding: 6px 10px; border-radius: 7px; font-size: 13px; min-height: 32px; }
    .views button[aria-pressed="true"] { background: var(--ink); color: #fff; }
    .legend { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 12px; padding: 8px 12px; background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 10px; font-size: 12px; color: var(--ink-2); }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .timeline { background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 8px; }
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .play { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; }
    .play svg { width: 16px; height: 16px; fill: currentColor; }
    .btn { height: 32px; padding: 0 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-size: 13px; }
    .now { display: flex; flex-direction: column; line-height: 1.15; min-width: 84px; }
    .now b { font-size: 17px; }
    .now span { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .shot { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; background: var(--ink); color: #FFB37A; font-weight: 600; font-variant-numeric: tabular-nums; }
    .shot small { font-size: 10px; color: #D9D2C7; font-weight: 500; letter-spacing: .06em; }
    .track { position: relative; }
    #beats { display: flex; gap: 4px; }
    .beat { flex: 1 1 0; min-width: 0; height: 50px; border: 0; border-radius: 8px; background: var(--surface-3); text-align: left; padding: 6px 9px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
    .beat b, .beat span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .beat b { font-size: 13px; }
    .beat span { font-size: 12px; color: var(--ink-2); }
    .beat.on { background: var(--accent); color: #fff; }
    .beat.on span { color: #FFE6DC; }
    .playhead { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); pointer-events: none; border-radius: 1px; }
    .note { font-size: 12px; color: var(--ink-2); margin-left: auto; }
    @media (max-width: 720px) {
      .title { font-size: 18px; }
      .themes { margin-left: 0; width: 100%; overflow-x: auto; flex-wrap: nowrap; }
      .themes button { flex: none; }
      .legend { display: none; }
      .beat span { display: none; }
      .note, #restart { display: none; }
      header { gap: 8px 10px; }
      .pill { display: none; }
      .caption { top: 8px; padding: 8px 12px; }
      .caption span { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <a class="brand" href="../"><img src="../assets/icon.svg" alt="" />Dance Studio</a>
      <span class="pill">Court Mode preview</span>
      <span class="title" id="play-name"></span>
      <div class="themes" role="group" aria-label="Team colors">
        <button data-theme-pick="rb"><span class="sw" style="background:#D62839"></span><span class="sw" style="background:#1F4FD1"></span>Red vs blue</button>
        <button data-theme-pick="tp"><span class="sw" style="background:#0E8C7F"></span><span class="sw" style="background:#6A3FC1"></span>Teal vs purple</button>
        <button data-theme-pick="gg"><span class="sw" style="background:#1E7B3C"></span><span class="sw" style="background:#F2B705"></span>Green vs gold</button>
        <button data-theme-pick="bw"><span class="sw" style="background:#1D1A17"></span><span class="sw" style="background:#F4F2EE"></span>Black vs white</button>
        <button data-theme-pick="nysa"><span class="sw" style="background:#F58426"></span><span class="sw" style="background:#C4CED4"></span>NY vs SA jerseys</button>
      </div>
    </header>

    <main>
      <div id="court"></div>
      <div id="labels"></div>
      <div class="caption" aria-live="polite"><b id="cap-title"></b><span id="cap-text"></span></div>
      <div class="views" role="group" aria-label="Camera">
        <button data-view="broadcast">Broadcast</button>
        <button data-view="baseline">Baseline</button>
        <button data-view="top">Top</button>
      </div>
      <div class="legend" aria-hidden="true">
        <span><svg width="26" height="10"><line x1="0" y1="5" x2="24" y2="5" stroke="#E0552E" stroke-width="2.5"/></svg>Cut</span>
        <span><svg width="26" height="10"><line x1="0" y1="5" x2="24" y2="5" stroke="#E0552E" stroke-width="2.5" stroke-dasharray="5 4"/></svg>Pass</span>
        <span><svg width="26" height="12"><line x1="0" y1="6" x2="20" y2="6" stroke="#1D1A17" stroke-width="2"/><line x1="21" y1="0" x2="21" y2="12" stroke="#1D1A17" stroke-width="4"/></svg>Screen</span>
      </div>
    </main>

    <section class="timeline" aria-label="Beats">
      <div class="controls">
        <button class="play" id="play" aria-label="Pause"></button>
        <div class="now"><b id="beat-now">Beat 1</b><span><span id="time">0:00.0</span> / <span id="total"></span></span></div>
        <div class="shot"><small>SHOT CLOCK</small><span id="clock">24.0</span></div>
        <button class="btn" id="restart">Restart</button>
        <button class="btn" id="speed" title="Playback speed">1×</button>
        <span class="note">Drag to orbit · click a beat to jump to it</span>
      </div>
      <div class="track">
        <div id="beats"></div>
        <div class="playhead" id="playhead"></div>
      </div>
    </section>
  </div>
  <script type="module" src="court.js"></script>
</body>
</html>
